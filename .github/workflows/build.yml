name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

# The plugin bundles its own static FFmpeg/libsrt and binds to libobs only
# through hand-written FFI (raw-dylib on Windows, undefined symbols elsewhere),
# so nothing here builds libobs any more. libobs gates a module on
# (major, minor) <= host version and looks up nothing but obs_module_*, so one
# artifact per platform loads on the floor below and every newer release.
env:
  # Documentation of that floor; it is mirrored by the api_version in
  # declare_module! (crates/irl-source/src/lib.rs). Raise both only to drop
  # support for older OBS releases, never to chase a newer one.
  OBS_VERSION: "32.1.2"
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # clang/libclang is a build dependency now: ffmpeg-sys-next runs bindgen
      # over the bundled FFmpeg headers, and obs-sys does the same for its
      # layout test.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config nasm meson ninja-build \
            clang libclang-dev libobs-dev libva-dev

      # rust-toolchain.toml pins the channel; this materialises it before the
      # cache action inspects it.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Only the install prefix is cached. The source and object trees are an
      # order of magnitude larger and the build-marker files live inside the
      # prefix, so a restored prefix alone is enough to skip every dep build.
      - name: Cache bundled deps
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps/.build/prefix
          key: irl-deps-linux-x64-${{ hashFiles('deps/versions.env', 'deps/build-deps.sh') }}

      - name: Build bundled deps
        run: ./deps/build-deps.sh

      - name: Build
        run: cargo build --release --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Formatting and spelling are checked once, on Linux: they are
      # platform-independent, so running them per platform only buys three
      # copies of the same failure. `make style` fixes both locally.
      - name: Format check
        run: make style-check

      - name: Spell check
        run: |
          pipx install codespell
          make spell-check

      # libobs-dev is installed here, so the test binaries that touch libobs
      # symbols (obs, irl-source) link and run on this runner only.
      - name: Test
        run: cargo test --workspace

      # Asserts the hand-written obs-sys structs against the real headers.
      - name: Test obs-sys layout against libobs headers
        run: cargo test -p obs-sys --features layout-test

      - name: Verify isolation
        run: ./scripts/verify-plugin.sh target/release/libobs_irl_source.so

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: obs-irl-source-linux-x64
          path: target/release/libobs_irl_source.so

  windows-x64:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        # msvc-dev-cmd has no Node 24 release yet (upstream ilammy/msvc-dev-cmd#105);
        # run its node20 bundle on the node24 runtime. This restates the
        # deprecation annotation ("forced to run on Node.js 24") rather than
        # silencing it — the point is to exercise the runtime that survives the
        # retirement, so a break surfaces now instead of when Node 20 is removed.
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # librist builds with meson. It has to be the Windows-native meson (so it
      # detects cl.exe rather than looking for a POSIX toolchain), which
      # path-type: inherit below then makes visible inside MSYS2.
      - name: Install meson
        shell: pwsh
        run: pip install --disable-pip-version-check meson ninja

      # FFmpeg's configure needs a POSIX shell even when it drives cl.exe.
      # path-type: inherit keeps the MSVC environment visible inside MSYS2.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make nasm diffutils pkgconf

      # bindgen needs libclang. The runner image ships LLVM, but pin it
      # explicitly so a change of image cannot silently break the build.
      - name: Install LLVM
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }

      - uses: Swatinem/rust-cache@v2

      - name: Cache bundled deps
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps/.build/prefix
          key: irl-deps-windows-x64-${{ hashFiles('deps/versions.env', 'deps/build-deps.sh') }}

      - name: Build bundled deps
        shell: msys2 {0}
        run: ./deps/build-deps.sh

      - name: Build
        shell: cmd
        run: cargo build --release --workspace

      - name: Clippy
        shell: cmd
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Only the FFI-free crates: a test binary that references a libobs
      # symbol imports obs.dll, and there is no OBS installed on this runner
      # for it to load against. The libobs-touching tests run on Linux.
      - name: Test
        shell: cmd
        run: cargo test -p irl-core -p irl-ffmpeg

      - name: Verify isolation
        shell: pwsh
        run: |
          $dll = "target/release/obs_irl_source.dll"
          $deps = (dumpbin /dependents $dll) -join "`n"
          $exports = (dumpbin /exports $dll) -join "`n"

          $fail = $false
          if ($deps -match 'av(codec|format|util)-\d+\.dll|sws(cale)?-\d+\.dll|swresample-\d+\.dll') {
            Write-Host "  FAIL  plugin still imports a host FFmpeg DLL"; $fail = $true
          } else {
            Write-Host "  ok    no FFmpeg DLL imports (host FFmpeg not required)"
          }
          # raw-dylib generates the obs.dll import table entry at link time;
          # if it is missing, the plugin resolved libobs some other way.
          if ($deps -match '(?i)\bobs\.dll\b') {
            Write-Host "  ok    imports obs.dll (raw-dylib binding to libobs)"
          } else {
            Write-Host "  FAIL  obs.dll not imported"; $fail = $true
          }
          if ($exports -match '\bav_|\bavcodec_|\bsrt_|\bmbedtls_') {
            Write-Host "  FAIL  bundled stack symbols are exported"; $fail = $true
          } else {
            Write-Host "  ok    bundled stack symbols not exported"
          }
          if ($exports -match 'obs_module_load') {
            Write-Host "  ok    obs_module_load exported"
          } else {
            Write-Host "  FAIL  obs_module_load missing"; $fail = $true
          }
          if ($fail) { Write-Host $deps; Write-Host $exports; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-irl-source-windows-x64
          path: |
            target/release/obs_irl_source.dll
            # PDB ships in the CI artifact (not the release zip) so a crash
            # log resolves plugin frames to function names. OBS's crash
            # handler reads it if it sits next to the DLL. It keeps its cargo
            # name; only the DLL is renamed when packaging.
            target/release/obs_irl_source.pdb

      # Built on every push rather than only in the release workflow, so a
      # syntax error in the .iss fails a normal build instead of a tag. The
      # version comes from Cargo.toml, which the release workflow already
      # verifies against the tag before it gets here.
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $match = Select-String -Path Cargo.toml `
            -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"' |
            Select-Object -First 1
          if (-not $match) { throw 'Could not read the version from Cargo.toml' }
          $version = $match.Matches[0].Groups[1].Value

          # Staged in the release zip's layout so the .iss has one file list
          # describing both.
          New-Item -ItemType Directory -Force -Path dist\windows\obs-plugins\64bit | Out-Null
          Copy-Item target\release\obs_irl_source.dll dist\windows\obs-plugins\64bit\obs-irl-source.dll

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }

          & $iscc "/DPluginVersion=$version" "/DPayloadDir=..\dist\windows" installer\obs-irl-source.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-irl-source-windows-installer
          path: dist/*.exe

  macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # bindgen's libclang: the Xcode toolchain's, so it matches the SDK the
      # rest of the build uses.
      LIBCLANG_PATH: /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib
    steps:
      - uses: actions/checkout@v6

      # ffmpeg is intentionally NOT installed from Homebrew. The plugin links
      # the bundled static stack instead, which is what removes its dependency
      # on whatever FFmpeg the host OBS ships. libobs itself is no longer
      # built here, so its build-time headers (simde, uthash, jansson) are
      # gone too.
      - name: Install build tools
        run: brew install cmake pkg-config nasm meson ninja

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache bundled deps
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps/.build/prefix
          key: irl-deps-macos-arm64-${{ hashFiles('deps/versions.env', 'deps/build-deps.sh') }}

      - name: Build bundled deps
        run: ./deps/build-deps.sh

      - name: Build
        run: cargo build --release --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # As on Windows: the libobs-touching test binaries need a libobs to
      # resolve against at load time, and there is none on this runner.
      - name: Test
        run: cargo test -p irl-core -p irl-ffmpeg

      - name: Verify isolation
        run: ./scripts/verify-plugin.sh target/release/libobs_irl_source.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: obs-irl-source-macos-arm64
          path: target/release/libobs_irl_source.dylib
