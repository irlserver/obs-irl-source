name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches the workspace version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -nE '/^\[workspace\.package\]/,/^\[[^w]/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          echo "tag: ${tag_version}  Cargo.toml: ${cargo_version}"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version = \"${cargo_version}\" in Cargo.toml. Bump the version, commit, then re-tag."
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The changelog is built from the commit range since the previous tag,
      # so the job needs full history and every tag, not the default shallow
      # single-commit checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Package layouts mirror where each platform expects plugins, so a
      # release archive is extracted straight into place with no renaming.
      # One archive per platform: the plugin bundles its own FFmpeg, so there
      # is no longer a per-OBS-line artifact to disambiguate. The layouts and
      # the cargo-name-to-OBS-name rename live in scripts/package.sh, which is
      # also what a maintainer runs to reproduce an archive locally.
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          chmod +x scripts/package.sh
          scripts/package.sh linux  artifacts/obs-irl-source-linux-x64   dist "${version}"
          scripts/package.sh windows artifacts/obs-irl-source-windows-x64 dist "${version}"
          scripts/package.sh macos  artifacts/obs-irl-source-macos-arm64 dist "${version}"
          scripts/package.sh deb    artifacts/obs-irl-source-linux-x64   dist "${version}"

          # Full source of the tagged tree. The bundled stack statically
          # links LGPL FFmpeg; shipping the corresponding source alongside
          # the binaries keeps the obligation self-contained in the release.
          git archive --format=tar.gz \
            --prefix="obs-irl-source-${version}/" \
            -o "dist/obs-irl-source-${version}-source.tar.gz" HEAD

          # Windows installer, built by the Windows job in build.yml. Same
          # payload as the zip above, for people who would rather not hand-copy
          # DLLs into Program Files.
          cp artifacts/obs-irl-source-windows-installer/*.exe dist/

          (cd dist && sha256sum ./* > sha256sums.txt)
          ls -l dist

      # Grouped by conventional commit type, so the draft already reads as a
      # changelog instead of needing one written by hand before publishing.
      - name: Build changelog
        run: |
          set -euo pipefail
          {
            cat .github/release-notes-header.md
            echo "## What's changed"
            echo
            scripts/changelog.sh "${GITHUB_REF_NAME}"
          } > notes.md
          cat notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "obs-irl-source ${version}" \
            --notes-file notes.md
