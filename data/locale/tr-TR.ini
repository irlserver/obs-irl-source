AudioBufferHelp="Hedef Arabellek, ağdaki dalgalanmaya (jitter) karşı tutulan tampondur ve gecikmeyi belirleyen ana ayardır. Uyarlanabilir Gecikme Kontrolü, sesi sınırlı bir hız düzeltmesiyle doğal hızına yakın tutar; bir takılmanın ardından biriken kısım atlanmaz, hafifçe hızlandırılarak oynatılır. Düşük değerler gecikmeyi azaltır ancak zayıf bağlantıda sessizlik veya takılma ihtimalini artırır. Göndericinin görüntüsü sesinden geç geliyorsa, dudak senkronunu korumak için ses bu tamponun üzerine aradaki fark kadar ayrıca bekletilir. Telafi Hızı, bu birikimin ne kadar hızlı eritilebileceğini belirler: varsayılan yüzde 5 birikimi çabuk temizler ama müzikte duyulabilir; daha düşük bir değer daha az fark edilir, buna karşılık toparlanma orantılı olarak daha uzun sürer."

