ClearOnDisconnect="Yayın Kesilince Hiçbir Şey Gösterme"
CloseWhenInactive="Kaynak Etkin Değilken Yayını Kapat"
AdvancedHelp="Anahtar Kareyi Bekle, başlangıçta ve yeniden bağlanmada bozuk kareler görünmesini önler, ancak en fazla bir anahtar kare aralığı kadar gecikme ekleyebilir. Düşük gecikme seçeneği bu kaynak için OBS'nin arabelleksiz asenkron ses modunu açar ve eklentinin normal jitter tamponunu biriktirmek yerine sesi hemen aktarmasını sağlar; daha hızlıdır ama ağdaki dalgalanmalara daha az dayanıklıdır. Yayın Kesilince Hiçbir Şey Gösterme, yayın koptuğu anda kaynağı boşaltır; son kare yeniden bağlanana kadar ekranda donmuş halde kalmaz. Kaynak Etkin Değilken Yayını Kapat, kaynak etkin olmadığında yayını almayı durdurur; yukarıdaki seçenek açıksa görüntüyü de temizler. FFmpeg Seçenekleri ile herhangi bir demuxer seçeneğini, örneğin buffer_size veya SRT latency değerini, değiştirebilirsiniz."

# %1 eklenti sürümüdür.
About="IRL Source v%1, Thomas Lekanger\nhttps://irlserver.com\n\nCodec ve protokolden bağımsız canlı yayın kaynağı: ses için jitter arabelleği, PTS süreksizlik onarımı, uyarlanabilir gecikme kontrolü ve ilk anahtar kareyi bekleme.\n\nAGPL-3.0-or-later lisansı altında dağıtılır."
