AdaptiveLatency="Adaptive Latenzsteuerung"
CatchUpSpeed="Aufholgeschwindigkeit"
AudioBufferHelp="Der Zielpuffer ist das Polster gegen Jitter im Netz und der wichtigste Regler für die Latenz. Die adaptive Latenzsteuerung hält den Ton mit begrenzter Geschwindigkeitskorrektur nahe der normalen Abspielrate; was sich während eines Aussetzers angestaut hat, wird leicht beschleunigt abgespielt statt übersprungen. Niedrigere Werte verringern die Verzögerung, machen bei schlechtem Signal aber Stille oder Ruckler wahrscheinlicher. Kommt das Bild des Senders später an als sein Ton, wird der Ton zusätzlich um diese Differenz zurückgehalten, damit Bild und Ton lippensynchron bleiben. Die Aufholgeschwindigkeit legt fest, wie schnell dieses Aufholen gehen darf: Die Voreinstellung von 5 Prozent baut einen Rückstau schnell ab, ist bei Musik aber hörbar; ein niedrigerer Wert fällt weniger auf und braucht entsprechend länger, bis der Rückstau abgebaut ist."

