ClearOnDisconnect="Nichts anzeigen, wenn der Stream endet"
CloseWhenInactive="Stream schließen, wenn die Quelle inaktiv ist"
AdvancedHelp="„Auf Keyframe warten“ verhindert fehlerhafte Bilder beim Start und bei der Neuverbindung, kann aber bis zu einem Keyframe-Intervall an Verzögerung hinzufügen. Die Option für niedrige Latenz schaltet für diese Quelle den ungepufferten asynchronen Audiomodus von OBS ein und lässt das Plugin den Ton sofort weitergeben, statt den üblichen Jitter-Puffer aufzubauen; das ist schneller, verträgt Schwankungen im Netz aber schlechter. „Nichts anzeigen, wenn der Stream endet“ leert die Quelle, sobald der Stream abbricht, statt das letzte Bild bis zur Neuverbindung eingefroren stehen zu lassen. „Stream schließen, wenn die Quelle inaktiv ist“ beendet den Empfang, solange die Quelle nicht aktiv ist, und leert das Bild, wenn die Option darüber eingeschaltet ist. Mit den FFmpeg-Optionen lässt sich jede Demuxer-Option überschreiben, zum Beispiel buffer_size oder die SRT-Latenz (latency)."

# %1 ist die Plugin-Version.
